name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collectors:
    name: Coletores (Python, Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["16", "18"]   # 16 no docker-compose local, 18 no Neon (produção)
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: franca
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: franca_transparencia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U franca -d franca_transparencia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Os testes de integração criam e apagam um banco próprio neste servidor.
      TEST_DATABASE_URL: postgresql://franca:ci@localhost:5432/franca_transparencia
    defaults:
      run:
        working-directory: services/collectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/collectors/pyproject.toml
      - run: pip install -e ".[postgres,dev]"
      - run: ruff check .
      - run: pytest -q

  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
