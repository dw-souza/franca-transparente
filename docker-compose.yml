# Painel de Transparência Cívica de Franca-SP — ambiente local
#
#   cp .env.example .env
#   docker compose up -d db migrate          # banco + schema
#   docker compose run --rm collector pncp coletar --desde 2026-01-01 --saida postgres
#
# O collector fica no profile "collect" para não subir sozinho com `docker compose up`.

name: franca-transparencia

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-franca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-franca_transparencia}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - log_min_duration_statement=500   # loga queries lentas (ms)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # só localhost
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-franca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-franca_transparencia}?sslmode=disable
      - up
    restart: "no"

  collector:
    build:
      context: ./services/collectors
    profiles: ["collect"]
    env_file: .env
    environment:
      # dentro da rede do compose o host do banco é "db"
      DATABASE_URL: postgresql://${POSTGRES_USER:-franca}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-franca_transparencia}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./services/collectors/endpoints:/app/endpoints:ro
      - ./dados:/app/dados
    command: ["pncp", "coletar", "--incremental", "--saida", "postgres"]

volumes:
  pgdata:
